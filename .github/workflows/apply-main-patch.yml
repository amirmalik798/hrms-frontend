name: Apply one-time main patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-main-patch.yml"
      - ".hrms-main-patch-*"

permissions:
  contents: write

jobs:
  apply-main-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply the validated patch and remove the helper files
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/hrms-main.patch.gz.b64"
          patch="$RUNNER_TEMP/hrms-main.patch"
          cat .hrms-main-patch-* > "$payload"
          actual_payload_sha="$(sha256sum "$payload" | cut -d' ' -f1)"
          test "$actual_payload_sha" = "39a3680b3f89f6777602b35d6e661f98057bd9a50d7eecb3366c7bf9f0db1144"
          base64 --decode "$payload" | gzip --decompress > "$patch"
          actual_patch_sha="$(sha256sum "$patch" | cut -d' ' -f1)"
          test "$actual_patch_sha" = "a94db20b88be1d1ed4bd440518b7c99366872e8a5aafa410e7b3d94f1d432259"
          git apply --check "$patch"
          git apply "$patch"
          rm -f .hrms-main-patch-00 .hrms-main-patch-01 .hrms-main-patch-02 .hrms-main-patch-03 .hrms-main-patch-04
          rm -f .github/workflows/apply-main-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix HRMS photos, names, attendance and reports"
          git push origin HEAD:main
